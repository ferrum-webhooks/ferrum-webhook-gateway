name: Gateway CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TESTING: true
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      TEST_DATABASE_URL: postgresql://ferrum:ferrum@localhost:5432/ferrum_test

    services:
      redis:            # token-bucket Lua script is tested against a real Redis
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
      postgres:         # Postgres-only behaviour (SKIP LOCKED, row locks, migrations) is tested against the real thing
        image: postgres:15
        env:
          POSTGRES_USER: ferrum
          POSTGRES_PASSWORD: ferrum
          POSTGRES_DB: ferrum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferrum" --health-interval 2s --health-timeout 2s --health-retries 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Set Python path
      run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

    - name: Migrations apply, roll back and re-apply on Postgres
      env:
        DB_HOST: localhost
        DB_PORT: "5432"
        DB_USER: ferrum
        DB_PASSWORD: ferrum
        DB_NAME: ferrum_test
        TESTING: "false"
      run: |
        python -m alembic upgrade head
        python -m alembic downgrade base
        python -m alembic upgrade head

    - name: Run tests
      run: pytest

    - name: Build Docker image
      run: |
        docker build -t ferrum-gateway:${{ github.sha }} .

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag image
      run: docker tag ferrum-gateway:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/gateway:${{ github.sha }}
    
    - name: Push image
      run: docker push ghcr.io/${{ github.repository_owner }}/gateway:${{ github.sha }}

    - name: Tag latest
      if: github.ref == 'refs/heads/main'
      run: docker tag ferrum-gateway:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/gateway:latest

    - name: Push latest
      if: github.ref == 'refs/heads/main'
      run: docker push ghcr.io/${{ github.repository_owner }}/gateway:latest